<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ScoopScope — paste a statement, extract structured claims for investigation.">
    <title>ScoopScope — Claim Extractor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-group">
                <div class="logo-icon" aria-hidden="true">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <circle cx="14" cy="14" r="12" stroke="currentColor" stroke-width="2"/>
                        <path d="M9 14.5L12.5 18L19 11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1 class="logo-text">ScoopScope</h1>
            </div>
            <p class="app-tagline">Extract structured claims from any statement</p>
        </header>

        <!-- Input Section -->
        <main class="main-content">
            <form id="extraction-form" class="input-card" autocomplete="off">
                <div class="form-group">
                    <label for="input-text" class="form-label">Statement</label>
                    <textarea
                        id="input-text"
                        class="form-textarea"
                        placeholder="Paste a statement containing one or more claims…"
                        rows="6"
                        maxlength="10000"
                        required
                    ></textarea>
                    <div class="char-counter">
                        <span id="char-count">0</span> / 10,000
                    </div>
                </div>
                <div class="form-group">
                    <label for="source-url" class="form-label">
                        Source URL <span class="label-optional">(optional)</span>
                    </label>
                    <input
                        id="source-url"
                        class="form-input"
                        type="url"
                        placeholder="https://example.com/article"
                    />
                </div>
                <button id="submit-btn" type="submit" class="btn-primary">
                    <span class="btn-label">Extract Claims</span>
                    <span class="btn-spinner" aria-hidden="true"></span>
                </button>
            </form>

            <!-- Error Banner -->
            <div id="error-banner" class="error-banner hidden" role="alert">
                <div class="error-icon" aria-hidden="true">⚠</div>
                <div class="error-body">
                    <strong id="error-title"></strong>
                    <p id="error-detail"></p>
                </div>
                <button id="error-dismiss" class="error-dismiss" aria-label="Dismiss">&times;</button>
            </div>

            <!-- Results Section -->
            <section id="results-section" class="results-section hidden" aria-live="polite">
                <div class="results-header">
                    <h2 class="results-title">Extracted Claims</h2>
                    <span id="results-status" class="results-status"></span>
                </div>
                <div class="submitted-context">
                    <div class="context-label">Original submission</div>
                    <blockquote id="submitted-text" class="submitted-text"></blockquote>
                    <div id="submitted-url-row" class="submitted-url-row hidden">
                        <span class="context-label">Source:</span>
                        <a id="submitted-url" class="submitted-url" target="_blank" rel="noopener noreferrer"></a>
                    </div>
                </div>
                <div id="claims-list" class="claims-list"></div>
                <div class="results-footer">
                    <p class="evidence-notice">
                        Claims extracted. Evidence research not yet performed.
                    </p>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>ScoopScope v0.1 — Claim extraction only. No verdicts, no simulated research.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
